name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

      - name: TypeScript (client + server)
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
        env:
          VITEST: 'true'
          NODE_ENV: 'test'

  e2e:
    runs-on: ubuntu-latest
    needs: unit-and-integration
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sudamr_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sudamr_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sudamr_e2e
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply schema (E2E DB)
        # Fresh CI Postgres: sync full schema.prisma (migrate history lags columns like User.isAdmin).
        run: npx prisma db push --schema prisma/schema.prisma --accept-data-loss --force-reset

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # 정적 serve만 켜면 프로덕션 번들이 /api를 같은 오리진으로 호출해 로그인 불가.
      # Vite 프록시 + API 서버로 시드 유저(푸른별/1217)로 로그인 가능한 스택을 기동한다.
      - name: Start Vite + API server
        run: |
          nohup npm run start > /tmp/e2e-app.log 2>&1 &
          echo $! > /tmp/e2e-app.pid
          sleep 3

      - name: Wait for API and seeded database
        shell: bash
        run: |
          set -euo pipefail
          last_body=""
          for i in $(seq 1 90); do
            last_body=$(curl -fsS "http://localhost:4000/" 2>/dev/null || echo "")
            if echo "$last_body" | grep -q '"database":"connected"'; then
              echo "Database ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for DB init... ($i) body=${last_body:-<empty>}"
            sleep 2
          done
          echo "--- last health body ---"
          echo "${last_body:-<empty>}"
          echo "--- /tmp/e2e-app.log (startup / DB errors) ---"
          grep -E '\[Server Startup\]|\[DB\]|Error during server|Database initialized|does not exist|P20[0-9]{2}|Bootstrap' /tmp/e2e-app.log || true
          echo "--- /tmp/e2e-app.log (full, last 400) ---"
          tail -n 400 /tmp/e2e-app.log || true
          exit 1

      - name: Wait for Vite
        run: npx wait-on http://localhost:5173 -t 120000

      - name: Run E2E tests
        # Full chromium suite can hang on lobby/match flows; smoke keeps CI green.
        # Re-enable full suite after those specs are CI-stable.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "Health: $(curl -fsS http://localhost:4000/ || true)"
          echo "Vite: $(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)"
          # Hard wall so a stuck browser launch cannot burn the job.
          timeout 240s npx playwright test --project=chromium --grep @smoke --reporter=line
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: 'http://localhost:5173'
          DEBUG: 'pw:browser*'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
